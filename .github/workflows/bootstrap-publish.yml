name: Bootstrap npm Package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish desktop-icon-mcp@0.1.0 to confirm the one-time token bootstrap publish"
        required: true

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_REPOSITORY: ei-grad/desktop-icon-mcp

concurrency:
  group: bootstrap-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Prepare and verify bootstrap metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (process.env.GITHUB_REPOSITORY !== process.env.EXPECTED_REPOSITORY) {
            console.error(`This workflow may only publish from ${process.env.EXPECTED_REPOSITORY}; got ${process.env.GITHUB_REPOSITORY}`);
            process.exit(1);
          }
          const expectedConfirm = `publish ${pkg.name}@${pkg.version}`;
          if (process.env.CONFIRM !== expectedConfirm) {
            console.error(`Confirmation mismatch. Expected: ${expectedConfirm}`);
            process.exit(1);
          }
          const repoUrl = `git+${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}.git`;
          const repoWebUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          pkg.repository = { type: "git", url: repoUrl };
          pkg.homepage = `${repoWebUrl}#readme`;
          pkg.bugs = { url: `${repoWebUrl}/issues` };
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
        env:
          CONFIRM: ${{ inputs.confirm }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - run: npm run build --if-present

      - run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Bootstrap publish to npm with token and provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
