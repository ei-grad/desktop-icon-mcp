name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_REPOSITORY: ei-grad/desktop-icon-mcp

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Prepare and verify release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (process.env.GITHUB_REPOSITORY !== process.env.EXPECTED_REPOSITORY) {
            console.error(`This workflow may only publish from ${process.env.EXPECTED_REPOSITORY}; got ${process.env.GITHUB_REPOSITORY}`);
            process.exit(1);
          }
          const expectedRepoUrl = `git+${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}.git`;
          const repoWebUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          pkg.repository = { type: "git", url: expectedRepoUrl };
          pkg.homepage = `${repoWebUrl}#readme`;
          pkg.bugs = { url: `${repoWebUrl}/issues` };
          if (process.env.GITHUB_REF_TYPE === "tag") {
            const expectedTag = `v${pkg.version}`;
            if (process.env.GITHUB_REF_NAME !== expectedTag) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}; expected ${expectedTag}`);
              process.exit(1);
            }
          }
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - run: npm run build --if-present

      - run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public
